<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>THE CORE | Хроники Души</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* =========================================
       1. БАЗА СТИЛЕЙ (Тёмная тема)
       ========================================= */
    :root {
      --bg: #050505; --surface: #121212; --elevated: #1e1e1e; --border: #333;
      --text: #fff; --text-muted: #888; 
      --red: #d90429; --gold: #d4af37; --green: #2ed573; --blue: #1e90ff; --purple: #9b59b6;
      --font: 'Inter', sans-serif; --display: 'Playfair Display', serif; --mono: 'Montserrat', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); overflow-x: hidden; min-height: 100vh; }
    
    /* Навигация */
    .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(5,5,5,0.9); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
    .back-btn { color: var(--gold); text-decoration: none; font-weight: 800; font-size: 1.2rem; transition: 0.2s; }
    .back-btn:hover { color: #fff; }
    .page-title { font-size: 1.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; font-family: var(--display); }

    .content { padding: 20px; max-width: 1000px; margin: 0 auto; padding-bottom: 100px; }

    /* =========================================
       2. СТАТИСТИКА ДНЕВНИКА
       ========================================= */
    .diary-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
    .stat-box { background: var(--surface); border: 1px solid var(--border); padding: 15px; border-radius: 12px; text-align: center; }
    .stat-val { font-size: 1.8rem; font-weight: 900; color: var(--gold); font-family: var(--display); }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; margin-top: 5px; }

    /* =========================================
       3. ФИЛЬТРЫ И ПОИСК
       ========================================= */
    .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
    .search-row { display: flex; gap: 10px; }
    .search-input { flex: 1; background: var(--elevated); border: 1px solid var(--border); color: var(--text); padding: 12px 20px; border-radius: 8px; font-family: var(--font); font-size: 0.95rem;}
    .search-input:focus { outline: none; border-color: var(--gold); }
    
    .tags-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .tags-row::-webkit-scrollbar { height: 4px; }
    .tags-row::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .tag-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .tag-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }
    .tag-btn:hover:not(.active) { border-color: #666; color: var(--text); }

    /* =========================================
       4. ТАЙМЛАЙН ДНЕВНИКА
       ========================================= */
    .month-divider { font-family: var(--display); font-size: 1.5rem; color: var(--gold); font-weight: 700; font-style: italic; margin: 30px 0 20px 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; }

    .diary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 25px; margin-bottom: 20px; position: relative; transition: 0.3s; cursor: pointer; animation: fadeIn 0.4s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .diary-card:hover { border-color: #555; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
    
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
    .card-date { font-size: 0.85rem; color: var(--gold); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .card-mood { font-size: 2rem; line-height: 1; }
    
    .card-summary { font-size: 1.1rem; font-weight: 800; margin-bottom: 10px; color: #fff; line-height: 1.4; }
    .card-snippet { font-size: 0.95rem; color: #aaa; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .card-tags { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
    .card-tag { font-size: 0.75rem; color: var(--blue); background: rgba(30, 144, 255, 0.1); padding: 4px 10px; border-radius: 12px; font-weight: 700; }

    .diary-full-text { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--border); color: #ddd; line-height: 1.7; white-space: pre-wrap; font-size: 1rem; }
    .diary-card.open .diary-full-text { display: block; }
    .diary-card.open .card-snippet { display: none; }
    
    .card-actions { display: none; margin-top: 20px; justify-content: flex-end; gap: 10px; }
    .diary-card.open .card-actions { display: flex; }
    .btn-mini { background: var(--elevated); border: 1px solid var(--border); color: #aaa; padding: 8px 15px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-mini:hover { background: var(--border); color: #fff; }
    .btn-mini.delete:hover { background: rgba(217,4,41,0.2); color: var(--red); border-color: var(--red); }

    /* =========================================
       5. КНОПКА ДОБАВЛЕНИЯ (FAB)
       ========================================= */
    .fab { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; background: var(--gold); color: #000; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2.2rem; border: none; cursor: pointer; box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4); transition: 0.3s; z-index: 90; }
    .fab:hover { transform: scale(1.1) rotate(90deg); box-shadow: 0 0 30px rgba(212, 175, 55, 0.6); }

    /* =========================================
       6. МОДАЛЬНОЕ ОКНО РЕДАКТОРА
       ========================================= */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; overflow-y: auto;}
    .modal.active { display: flex; }
    .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 700px; padding: 30px; animation: slideUp 0.3s ease; margin: 40px auto; }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    
    .modal-header { font-family: var(--display); color: var(--gold); font-size: 1.8rem; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;}
    .close-btn { background: none; border: none; color: #888; font-size: 2rem; cursor: pointer; }
    .close-btn:hover { color: var(--red); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;}
    .input-field { width: 100%; background: var(--elevated); border: 1px solid var(--border); color: var(--text); padding: 14px 15px; border-radius: 8px; font-family: var(--font); font-size: 1rem; }
    .input-field:focus { outline: none; border-color: var(--gold); }
    .textarea { height: 250px; resize: vertical; line-height: 1.6; }
    
    .mood-picker { display: flex; gap: 10px; flex-wrap: wrap; }
    .mood-btn { font-size: 1.8rem; background: var(--elevated); border: 2px solid transparent; border-radius: 12px; width: 55px; height: 55px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center;}
    .mood-btn:hover { background: var(--border); }
    .mood-btn.sel { border-color: var(--gold); background: rgba(212,175,55,0.1); transform: scale(1.1); }

    .tag-input-wrapper { display: flex; gap: 10px; margin-bottom: 10px; }
    .tag-input { flex: 1; background: var(--elevated); border: 1px solid var(--border); color: var(--text); padding: 10px 15px; border-radius: 8px; }
    .add-tag-btn { background: var(--border); border: none; color: #fff; padding: 0 15px; border-radius: 8px; cursor: pointer; }
    .active-tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .active-tag { background: rgba(30, 144, 255, 0.2); color: var(--blue); padding: 5px 12px; border-radius: 15px; font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .active-tag span { cursor: pointer; font-size: 1.2rem; line-height: 1; color: var(--red); }

    .btn-save { width: 100%; background: var(--gold); color: #000; border: none; padding: 18px; border-radius: 10px; font-weight: 900; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    .btn-save:hover { background: #e6c14e; box-shadow: 0 0 20px rgba(212,175,55,0.4); }

    /* Переключатель ночной смены */
    .switch-wrapper { display: flex; align-items: center; justify-content: space-between; background: rgba(217,4,41,0.1); padding: 15px; border-radius: 8px; border: 1px solid rgba(217,4,41,0.3); margin-bottom: 20px;}
    .switch-label { font-size: 0.9rem; font-weight: 700; color: #ff4757; }
    .switch-desc { font-size: 0.75rem; color: #888; }
    .toggle-switch { position: relative; width: 50px; height: 26px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--red); }
    input:checked + .slider:before { transform: translateX(24px); }

    /* Smart Summary Box */
    .smart-summary-box { background: linear-gradient(135deg, rgba(46,213,115,0.1), transparent); border-left: 4px solid var(--green); padding: 15px; border-radius: 0 8px 8px 0; margin-bottom: 20px; display: none; }
    .smart-summary-box.show { display: block; }
    .smart-summary-title { font-size: 0.8rem; color: var(--green); font-weight: 900; text-transform: uppercase; margin-bottom: 5px; }
    .smart-summary-text { font-size: 0.95rem; color: #ddd; font-style: italic; }

  </style>
</head>
<body>

<header class="top-nav">
  <a href="index.html" class="back-btn">←</a>
  <div class="page-title">Хроники Души</div>
  <div style="width:24px;"></div>
</header>

<div class="content">

  <!-- Статистика -->
  <div class="diary-stats">
    <div class="stat-box">
      <div class="stat-val" id="totalEntries">0</div>
      <div class="stat-label">Записей</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="currentStreak">0</div>
      <div class="stat-label">Дней подряд</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="mostFrequentMood">-</div>
      <div class="stat-label">Частое настроение</div>
    </div>
  </div>

  <!-- Поиск и Фильтры -->
  <div class="controls">
    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="Поиск по тексту или заголовку..." oninput="renderDiary()">
    </div>
    <div class="tags-row" id="tagsContainer">
      <button class="tag-btn active" onclick="setTagFilter('all', this)">Все записи</button>
      <!-- Теги будут добавляться динамически -->
    </div>
  </div>

  <!-- Таймлайн -->
  <div id="diaryContainer">
    <!-- Сюда рендерятся записи -->
  </div>

</div>

<!-- Кнопка добавления -->
<button class="fab" onclick="openEditor()">+</button>

<!-- МОДАЛКА РЕДАКТОРА -->
<div class="modal" id="editorModal">
  <div class="modal-box">
    <div class="modal-header">
      <span id="modalTitleText">Новая запись</span>
      <button class="close-btn" onclick="closeEditor()">×</button>
    </div>

    <div class="switch-wrapper">
      <div>
        <div class="switch-label">🌙 Ночная смена / После полуночи?</div>
        <div class="switch-desc">Запись будет привязана к предыдущему дню</div>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="nightShiftToggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="form-group">
      <label>Заголовок (О чем думаешь?)</label>
      <input type="text" id="entryTitle" class="input-field" placeholder="Кратко: Итоги дня, мысль, событие...">
    </div>

    <div class="form-group">
      <label>Текст записи</label>
      <textarea id="entryText" class="input-field textarea" placeholder="Выплесни всё, что на душе. Здесь тебя никто не осудит..." oninput="analyzeTextForSummary()"></textarea>
    </div>

    <div class="smart-summary-box" id="smartSummaryBox">
      <div class="smart-summary-title">🤖 Smart-Анализ</div>
      <div class="smart-summary-text" id="smartSummaryText"></div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Настроение</label>
        <div class="mood-picker" id="moodPicker">
          <button class="mood-btn sel" onclick="selectMood(this, '⚔️')">⚔️</button>
          <button class="mood-btn" onclick="selectMood(this, '🔥')">🔥</button>
          <button class="mood-btn" onclick="selectMood(this, '💰')">💰</button>
          <button class="mood-btn" onclick="selectMood(this, '😭')">😭</button>
          <button class="mood-btn" onclick="selectMood(this, '💀')">💀</button>
          <button class="mood-btn" onclick="selectMood(this, '🧠')">🧠</button>
          <button class="mood-btn" onclick="selectMood(this, '😡')">😡</button>
          <button class="mood-btn" onclick="selectMood(this, '😌')">😌</button>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Теги (через Enter)</label>
      <div class="tag-input-wrapper">
        <input type="text" id="tagInput" class="tag-input" placeholder="Например: #машина, #она, #устал">
        <button class="add-tag-btn" onclick="addTag()">+</button>
      </div>
      <div class="active-tags" id="activeTagsContainer"></div>
    </div>

    <button class="btn-save" onclick="saveEntry()">Сохранить в Хронику</button>
  </div>
</div>

<script>
  /* ==========================================
     FIREBASE CONFIG
     ========================================== */
  const firebaseConfig = {
    apiKey: "AIzaSyDrPu0bv13jvnju8JJyHkgeRQcf66fDtlk",
    authDomain: "our-tracker-3cbb5.firebaseapp.com",
    databaseURL: "https://our-tracker-3cbb5-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "our-tracker-3cbb5"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const DB_DIARY = db.ref('man_diary');

  // Глобальный стейт
  let allEntries = [];
  let filteredEntries = [];
  let currentTagFilter = 'all';
  let currentMood = '⚔️';
  let currentTags = [];
  let editingId = null;

  /* ==========================================
     СЛУШАЕМ FIREBASE
     ========================================== */
  DB_DIARY.on('value', (snap) => {
    if(snap.exists()) {
      const data = snap.val();
      // Преобразуем объект в массив и сортируем по timestamp (новые сверху)
      allEntries = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      allEntries.sort((a, b) => b.timestamp - a.timestamp);
    } else {
      allEntries = [];
    }
    updateStats();
    renderTags();
    renderDiary();
  });

  /* ==========================================
     СТАТИСТИКА
     ========================================== */
  function updateStats() {
    document.getElementById('totalEntries').innerText = allEntries.length;
    
    // Считаем стрик (дни подряд с записями)
    let streak = 0;
    if(allEntries.length > 0) {
      let currentDate = new Date();
      currentDate.setHours(0,0,0,0);
      
      const uniqueDates = [...new Set(allEntries.map(e => new Date(e.timestamp).setHours(0,0,0,0)))];
      
      for(let i=0; i<uniqueDates.length; i++) {
        if(uniqueDates[i] === currentDate.getTime() || (i===0 && uniqueDates[i] === currentDate.getTime() - 86400000)) {
            streak++;
            currentDate.setDate(currentDate.getDate() - 1);
        } else if (uniqueDates[i] < currentDate.getTime()) {
            break;
        }
      }
    }
    document.getElementById('currentStreak').innerText = streak;

    // Частое настроение
    if(allEntries.length > 0) {
      const moods = allEntries.map(e => e.mood);
      const counts = {};
      let maxMood = moods[0];
      let maxCount = 0;
      moods.forEach(m => { counts[m] = (counts[m] || 0) + 1; if(counts[m] > maxCount) { maxCount = counts[m]; maxMood = m; } });
      document.getElementById('mostFrequentMood').innerText = maxMood;
    } else {
      document.getElementById('mostFrequentMood').innerText = '-';
    }
  }

  /* ==========================================
     РЕНДЕР ТЕГОВ ДЛЯ ФИЛЬТРА
     ========================================== */
  function renderTags() {
    const container = document.getElementById('tagsContainer');
    // Оставляем кнопку "Все"
    container.innerHTML = '<button class="tag-btn ' + (currentTagFilter === 'all' ? 'active' : '') + '" onclick="setTagFilter(\'all\', this)">Все записи</button>';
    
    // Собираем все уникальные теги
    const tags = new Set();
    allEntries.forEach(e => {
      if(e.tags) e.tags.forEach(t => tags.add(t));
    });

    tags.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'tag-btn ' + (currentTagFilter === tag ? 'active' : '');
      btn.innerText = tag;
      btn.onclick = () => setTagFilter(tag, btn);
      container.appendChild(btn);
    });
  }

  function setTagFilter(tag, btn) {
    document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTagFilter = tag;
    renderDiary();
  }

  /* ==========================================
     РЕНДЕР ДНЕВНИКА (ТАЙМЛАЙН)
     ========================================== */
  function renderDiary() {
    const searchQuery = document.getElementById('searchInput').value.toLowerCase();
    const container = document.getElementById('diaryContainer');
    container.innerHTML = '';

    // Фильтрация
    filteredEntries = allEntries.filter(entry => {
      const matchSearch = (entry.title || '').toLowerCase().includes(searchQuery) || (entry.text || '').toLowerCase().includes(searchQuery);
      const matchTag = currentTagFilter === 'all' || (entry.tags && entry.tags.includes(currentTagFilter));
      return matchSearch && matchTag;
    });

    if(filteredEntries.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:50px; color:#666;"><h3>Ничего не найдено</h3><p>Попробуй изменить фильтры или напиши новую запись.</p></div>';
      return;
    }

    let currentMonthYear = '';

    filteredEntries.forEach(entry => {
      const dateObj = new Date(entry.timestamp);
      const monthYear = dateObj.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
      const dateStr = dateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      
      // Разделитель по месяцам
      if(monthYear !== currentMonthYear) {
        currentMonthYear = monthYear;
        const divider = document.createElement('div');
        divider.className = 'month-divider';
        divider.innerText = currentMonthYear;
        container.appendChild(divider);
      }

      // Карточка
      const card = document.createElement('div');
      card.className = 'diary-card';
      card.id = 'entry-' + entry.id;
      card.onclick = (e) => {
        // Если кликнули не на кнопку, открываем/закрываем
        if(!e.target.closest('button')) card.classList.toggle('open');
      };

      // Теги
      let tagsHtml = '';
      if(entry.tags && entry.tags.length > 0) {
        entry.tags.forEach(t => {
          tagsHtml += `<span class="card-tag">${t}</span>`;
        });
      }

      card.innerHTML = `
        <div class="card-header">
          <div class="card-date">${dateStr}</div>
          <div class="card-mood">${entry.mood || '📝'}</div>
        </div>
        <div class="card-summary">${entry.title || 'Без заголовка'}</div>
        <div class="card-snippet">${entry.text}</div>
        <div class="diary-full-text">${entry.text}</div>
        <div class="card-tags">${tagsHtml}</div>
        
        <div class="card-actions">
          <button class="btn-mini" onclick="editEntry('${entry.id}')">✏️ Редактировать</button>
          <button class="btn-mini delete" onclick="deleteEntry('${entry.id}')">🗑 Удалить</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  /* ==========================================
     SMART AI АНАЛИЗ (Умный Итог)
     ========================================== */
  function analyzeTextForSummary() {
    const text = document.getElementById('entryText').value.toLowerCase();
    const box = document.getElementById('smartSummaryBox');
    const out = document.getElementById('smartSummaryText');
    
    if(text.length < 10) {
      box.classList.remove('show');
      return;
    }

    let insight = "Запись сохранена. Продолжай рефлексировать.";
    box.style.borderLeftColor = "var(--green)";
    
    // Логика анализа по ключевым словам
    if(text.includes('устал') || text.includes('нет сил') || text.includes('болит') || text.includes('выгор')) {
      insight = "Обнаружено сильное физическое или эмоциональное истощение. Тебе нужен отдых и сон.";
      box.style.borderLeftColor = "var(--red)";
    } else if (text.includes('заработал') || text.includes('доход') || text.includes('смена') || text.includes('такси')) {
      insight = "Финансовый фокус. Ты движешься к своим целям через работу.";
      box.style.borderLeftColor = "var(--gold)";
    } else if (text.includes('она') || text.includes('любовь') || text.includes('отношения') || text.includes('девушка')) {
      insight = "Эмоциональные переживания. Работа над отношениями и личными границами.";
      box.style.borderLeftColor = "var(--purple)";
    } else if (text.includes('машина') || text.includes('ремонт') || text.includes('купил')) {
      insight = "Движение к материальной цели. Ты строишь свою базу.";
      box.style.borderLeftColor = "var(--blue)";
    } else if (text.includes('план') || text.includes('цель') || text.includes('решил')) {
      insight = "Стратегическое планирование. Ты берешь контроль над жизнью.";
    }

    out.innerText = `💡 ${insight}`;
    box.classList.add('show');
  }

  /* ==========================================
     РЕДАКТОР (СОЗДАНИЕ / РЕДАКТИРОВАНИЕ)
     ========================================== */
  function openEditor() {
    editingId = null;
    document.getElementById('modalTitleText').innerText = "Новая запись";
    document.getElementById('entryTitle').value = '';
    document.getElementById('entryText').value = '';
    document.getElementById('nightShiftToggle').checked = false;
    document.getElementById('smartSummaryBox').classList.remove('show');
    
    // Сброс настроения
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('sel'));
    document.querySelector('.mood-btn').classList.add('sel');
    currentMood = '⚔️';
    
    // Сброс тегов
    currentTags = [];
    renderActiveTags();

    document.getElementById('editorModal').classList.add('active');
  }

  function editEntry(id) {
    const entry = allEntries.find(e => e.id === id);
    if(!entry) return;

    editingId = id;
    document.getElementById('modalTitleText').innerText = "Редактирование";
    document.getElementById('entryTitle').value = entry.title || '';
    document.getElementById('entryText').value = entry.text || '';
    
    // Восстановление настроения
    document.querySelectorAll('.mood-btn').forEach(b => {
      b.classList.remove('sel');
      if(b.innerText === entry.mood) b.classList.add('sel');
    });
    currentMood = entry.mood;

    // Восстановление тегов
    currentTags = entry.tags || [];
    renderActiveTags();

    analyzeTextForSummary();
    document.getElementById('editorModal').classList.add('active');
  }

  function closeEditor() {
    document.getElementById('editorModal').classList.remove('active');
  }

  function selectMood(btn, emoji) {
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('sel'));
    btn.classList.add('sel');
    currentMood = emoji;
  }

  function addTag() {
    const input = document.getElementById('tagInput');
    let tag = input.value.trim();
    if(!tag) return;
    if(!tag.startsWith('#')) tag = '#' + tag;
    if(!currentTags.includes(tag)) {
      currentTags.push(tag);
      renderActiveTags();
    }
    input.value = '';
  }

  function removeTag(tag) {
    currentTags = currentTags.filter(t => t !== tag);
    renderActiveTags();
  }

  function renderActiveTags() {
    const container = document.getElementById('activeTagsContainer');
    container.innerHTML = '';
    currentTags.forEach(t => {
      container.innerHTML += `<div class="active-tag">${t} <span onclick="removeTag('${t}')">×</span></div>`;
    });
  }

  function saveEntry() {
    const title = document.getElementById('entryTitle').value.trim();
    const text = document.getElementById('entryText').value.trim();
    const isNightShift = document.getElementById('nightShiftToggle').checked;

    if(!title || !text) return alert("Заполни заголовок и текст!");

    // Логика ночной смены
    let timestamp = Date.now();
    if(isNightShift) {
      // Отматываем на 4 часа назад, чтобы запись попала в предыдущий день
      timestamp -= 4 * 60 * 60 * 1000; 
    }

    const entryData = {
      title: title,
      text: text,
      mood: currentMood,
      tags: currentTags,
      timestamp: timestamp
    };

    if(editingId) {
      // Обновление существующей
      DB_DIARY.child(editingId).update(entryData).then(() => {
        closeEditor();
      });
    } else {
      // Создание новой
      DB_DIARY.push(entryData).then(() => {
        closeEditor();
      });
    }
  }

  function deleteEntry(id) {
    if(confirm("Ты уверен, что хочешь удалить эту запись из истории?")) {
      DB_DIARY.child(id).remove();
    }
  }

</script>
</body>
