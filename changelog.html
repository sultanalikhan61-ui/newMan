<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>THE CORE | Change Log</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* =========================================
       БАЗА СТИЛЕЙ
       ========================================= */
    :root {
      --bg: #050505; --surface: #121212; --elevated: #1e1e1e; --border: #333;
      --text: #fff; --text-muted: #888; 
      --red: #d90429; --gold: #d4af37; --green: #2ed573; --blue: #1e90ff; --purple: #9b59b6;
      --font: 'Inter', sans-serif; --display: 'Playfair Display', serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); overflow-x: hidden; min-height: 100vh; }
    
    /* Навигация */
    .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(5,5,5,0.9); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
    .back-btn { color: var(--gold); text-decoration: none; font-weight: 800; font-size: 1.2rem; transition: 0.2s; }
    .back-btn:hover { color: #fff; }
    .page-title { font-size: 1.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; font-family: var(--display); }

    .content { padding: 20px; max-width: 900px; margin: 0 auto; padding-bottom: 100px; }

    /* =========================================
       ВЕРХНЯЯ ПАНЕЛЬ (СТАТИСТИКА И ФИЛЬТРЫ)
       ========================================= */
    .stats-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); padding: 15px 20px; border-radius: 12px; text-align: center; }
    .stat-val { font-size: 2rem; font-weight: 900; color: var(--gold); font-family: var(--display); }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }

    .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
    .search-box { display: flex; gap: 10px; }
    .search-input { flex: 1; background: var(--elevated); border: 1px solid var(--border); color: var(--text); padding: 12px 20px; border-radius: 8px; font-family: var(--font); }
    .search-input:focus { outline: none; border-color: var(--gold); }
    
    .filters { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .filters::-webkit-scrollbar { height: 4px; }
    .filters::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .filter-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }
    .filter-btn:hover:not(.active) { border-color: var(--text); color: var(--text); }

    /* =========================================
       ТАЙМЛАЙН
       ========================================= */
    .timeline { position: relative; padding-left: 30px; }
    .timeline::before {
      content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px;
      background: linear-gradient(to bottom, var(--gold), var(--border), transparent);
    }

    .log-item { position: relative; margin-bottom: 30px; animation: slideIn 0.3s ease forwards; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    
    /* Точка на линии */
    .log-item::before {
      content: ''; position: absolute; left: -27px; top: 5px; width: 12px; height: 12px;
      background: var(--surface); border: 3px solid var(--gold); border-radius: 50%;
      z-index: 2; transition: 0.3s;
    }
    .log-item.major::before { border-color: var(--red); background: var(--red); box-shadow: 0 0 15px var(--red); }

    .log-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; position: relative; transition: 0.3s; }
    .log-card:hover { border-color: #555; transform: translateX(5px); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .log-item.major .log-card { border-color: rgba(217, 4, 41, 0.4); background: linear-gradient(135deg, rgba(217,4,41,0.05) 0%, var(--surface) 100%); }

    .log-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .log-date { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; }
    
    .log-tag { font-size: 0.7rem; padding: 3px 10px; border-radius: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
    .tag-finance { background: rgba(46, 213, 115, 0.2); color: var(--green); }
    .tag-health { background: rgba(255, 159, 243, 0.2); color: #ff9ff3; }
    .tag-relationship { background: rgba(155, 89, 182, 0.2); color: var(--purple); }
    .tag-work { background: rgba(30, 144, 255, 0.2); color: var(--blue); }
    .tag-personal { background: rgba(212, 175, 55, 0.2); color: var(--gold); }

    .log-title { font-size: 1.1rem; font-weight: 800; color: var(--text); margin-bottom: 8px; }
    .log-desc { font-size: 0.95rem; color: #bbb; line-height: 1.5; white-space: pre-wrap; }
    
    .delete-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #555; cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
    .delete-btn:hover { color: var(--red); }

    /* =========================================
       КНОПКА ДОБАВЛЕНИЯ (FAB)
       ========================================= */
    .fab {
      position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
      background: var(--gold); color: #000; border-radius: 50%; display: flex;
      justify-content: center; align-items: center; font-size: 2rem; border: none;
      cursor: pointer; box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4); transition: 0.3s; z-index: 90;
    }
    .fab:hover { transform: scale(1.1) rotate(90deg); box-shadow: 0 0 30px rgba(212, 175, 55, 0.6); }

    /* =========================================
       МОДАЛЬНОЕ ОКНО
       ========================================= */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 500px; padding: 30px; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; }
    .input-field { width: 100%; background: var(--elevated); border: 1px solid var(--border); color: var(--text); padding: 12px 15px; border-radius: 8px; font-family: var(--font); font-size: 1rem; }
    .input-field:focus { outline: none; border-color: var(--gold); }
    .textarea { height: 120px; resize: none; }
    
    .category-select { display: flex; flex-wrap: wrap; gap: 10px; }
    .cat-radio { display: none; }
    .cat-label { padding: 8px 15px; border-radius: 20px; background: var(--elevated); border: 1px solid var(--border); cursor: pointer; font-size: 0.8rem; font-weight: 700; transition: 0.2s; }
    .cat-radio:checked + .cat-label { background: var(--gold); color: #000; border-color: var(--gold); }

    .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; cursor: pointer; }
    .checkbox-group input { width: 20px; height: 20px; accent-color: var(--red); }
    .checkbox-group label { font-size: 0.9rem; font-weight: 600; cursor: pointer; }

    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    .btn { flex: 1; padding: 14px; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; border: none; transition: 0.2s; }
    .btn-cancel { background: var(--elevated); color: var(--text); }
    .btn-save { background: var(--gold); color: #000; }
    .btn:hover { opacity: 0.8; }

    /* Пустое состояние */
    .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
    .empty-icon { font-size: 4rem; margin-bottom: 15px; opacity: 0.5; }
  </style>
</head>
<body>

<header class="top-nav">
  <a href="index.html" class="back-btn">←</a>
  <div class="page-title">Журнал Трансформации</div>
  <div style="width:24px;"></div>
</header>

<div class="content">

  <!-- Статистика -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-val" id="totalLogsCount">0</div>
      <div class="stat-label">Всего записей</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="majorLogsCount">0</div>
      <div class="stat-label">Мажорных побед</div>
    </div>
  </div>

  <!-- Поиск и Фильтры -->
  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Поиск по записям..." oninput="renderTimeline()">
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">Все</button>
      <button class="filter-btn" onclick="setFilter('finance', this)">Финансы</button>
      <button class="filter-btn" onclick="setFilter('health', this)">Здоровье</button>
      <button class="filter-btn" onclick="setFilter('relationship', this)">Отношения</button>
      <button class="filter-btn" onclick="setFilter('work', this)">Работа</button>
      <button class="filter-btn" onclick="setFilter('personal', this)">Личное</button>
    </div>
  </div>

  <!-- Сам Таймлайн -->
  <div class="timeline" id="timelineContainer">
    <!-- Сюда рендерятся карточки -->
  </div>

</div>

<!-- Кнопка добавления -->
<button class="fab" onclick="openModal()">+</button>

<!-- Модалка -->
<div class="modal" id="logModal">
  <div class="modal-box">
    <h2 style="margin-bottom: 25px; font-family: var(--display); color: var(--gold);">Новая запись</h2>
    
    <div class="input-group">
      <label>Заголовок (Что произошло?)</label>
      <input type="text" id="logTitle" class="input-field" placeholder="Например: Закрыл долг Абылаю">
    </div>

    <div class="input-group">
      <label>Категория</label>
      <div class="category-select">
        <input type="radio" name="cat" id="cat-fin" value="finance" class="cat-radio" checked>
        <label for="cat-fin" class="cat-label">💰 Финансы</label>

        <input type="radio" name="cat" id="cat-heal" value="health" class="cat-radio">
        <label for="cat-heal" class="cat-label">🫀 Здоровье</label>

        <input type="radio" name="cat" id="cat-rel" value="relationship" class="cat-radio">
        <label for="cat-rel" class="cat-label">💔 Отношения</label>

        <input type="radio" name="cat" id="cat-work" value="work" class="cat-radio">
        <label for="cat-work" class="cat-label">💼 Работа</label>

        <input type="radio" name="cat" id="cat-pers" value="personal" class="cat-radio">
        <label for="cat-pers" class="cat-label">🧠 Личное</label>
      </div>
    </div>

    <div class="input-group">
      <label>Описание (Детали, мысли)</label>
      <textarea id="logDesc" class="input-field textarea" placeholder="Опиши свои эмоции или конкретные цифры..."></textarea>
    </div>

    <label class="checkbox-group">
      <input type="checkbox" id="logMajor">
      <label for="logMajor">🔥 Это мажорная победа (Выделить красным)</label>
    </label>

    <div class="btn-group">
      <button class="btn btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="btn btn-save" onclick="saveLog()">Сохранить</button>
    </div>
  </div>
</div>

<script>
  /* ==========================================
     FIREBASE CONFIG
     ========================================== */
  const firebaseConfig = {
    apiKey: "AIzaSyDrPu0bv13jvnju8JJyHkgeRQcf66fDtlk",
    authDomain: "our-tracker-3cbb5.firebaseapp.com",
    databaseURL: "https://our-tracker-3cbb5-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "our-tracker-3cbb5"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const DB_CHANGELOG = db.ref('man_changelog');

  // Состояние
  let allLogs = [];
  let currentFilter = 'all';
  let searchQuery = '';

  // Слушаем базу
  DB_CHANGELOG.on('value', (snap) => {
    if(snap.exists()) {
      const data = snap.val();
      // Преобразуем объект в массив и сортируем по дате (новые сверху)
      allLogs = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      allLogs.sort((a, b) => b.timestamp - a.timestamp);
    } else {
      allLogs = [];
    }
    updateStats();
    renderTimeline();
  });

  /* ==========================================
     ЛОГИКА РЕНДЕРА ТАЙМЛАЙНА
     ========================================== */
  function renderTimeline() {
    const container = document.getElementById('timelineContainer');
    searchQuery = document.getElementById('searchInput').value.toLowerCase();
    
    // Фильтруем
    const filtered = allLogs.filter(log => {
      const matchCategory = currentFilter === 'all' || log.category === currentFilter;
      const matchSearch = log.title.toLowerCase().includes(searchQuery) || log.desc.toLowerCase().includes(searchQuery);
      return matchCategory && matchSearch;
    });

    if(filtered.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">📜</div><h3>Здесь пока пусто</h3><p>Добавь свою первую победу или изменение.</p></div>`;
      return;
    }

    container.innerHTML = '';
    
    filtered.forEach(log => {
      const dateObj = new Date(log.timestamp);
      const dateStr = dateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      
      const isMajor = log.major ? 'major' : '';
      
      let tagClass = 'tag-personal';
      let tagName = 'Личное';
      if(log.category === 'finance') { tagClass = 'tag-finance'; tagName = 'Финансы'; }
      if(log.category === 'health') { tagClass = 'tag-health'; tagName = 'Здоровье'; }
      if(log.category === 'relationship') { tagClass = 'tag-relationship'; tagName = 'Отношения'; }
      if(log.category === 'work') { tagClass = 'tag-work'; tagName = 'Работа'; }

      const card = document.createElement('div');
      card.className = `log-item ${isMajor}`;
      card.innerHTML = `
        <div class="log-card">
          <button class="delete-btn" onclick="deleteLog('${log.id}')" title="Удалить">✖</button>
          <div class="log-header">
            <div class="log-date">${dateStr}</div>
            <div class="log-tag ${tagClass}">${tagName}</div>
          </div>
          <div class="log-title">${log.title}</div>
          <div class="log-desc">${log.desc}</div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  /* ==========================================
     СТАТИСТИКА
     ========================================== */
  function updateStats() {
    document.getElementById('totalLogsCount').innerText = allLogs.length;
    const majors = allLogs.filter(l => l.major).length;
    document.getElementById('majorLogsCount').innerText = majors;
  }

  /* ==========================================
     УПРАВЛЕНИЕ ФИЛЬТРАМИ
     ========================================== */
  function setFilter(cat, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = cat;
    renderTimeline();
  }

  /* ==========================================
     МОДАЛКА И СОХРАНЕНИЕ
     ========================================== */
  function openModal() {
    document.getElementById('logModal').classList.add('active');
    document.getElementById('logTitle').value = '';
    document.getElementById('logDesc').value = '';
    document.getElementById('logMajor').checked = false;
    document.getElementById('cat-fin').checked = true;
  }

  function closeModal() {
    document.getElementById('logModal').classList.remove('active');
  }

  function saveLog() {
    const title = document.getElementById('logTitle').value.trim();
    const desc = document.getElementById('logDesc').value.trim();
    const major = document.getElementById('logMajor').checked;
    
    // Получаем выбранную категорию
    const catRadios = document.getElementsByName('cat');
    let category = 'personal';
    for(let r of catRadios) { if(r.checked) category = r.value; }

    if(!title) return alert("Введи заголовок!");

    const newLog = {
      title: title,
      desc: desc,
      category: category,
      major: major,
      timestamp: Date.now()
    };

    DB_CHANGELOG.push(newLog).then(() => {
      closeModal();
    });
  }

  function deleteLog(id) {
    if(confirm("Удалить эту запись из истории?")) {
      DB_CHANGELOG.child(id).remove();
    }
  }

</script>
</body>
</html>
