<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>THE CORE | Business Incubator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* =========================================
       БАЗА СТИЛЕЙ (Тёмная тема)
       ========================================= */
    :root {
      --bg: #050505; --surface: #121212; --elevated: #1e1e1e; --border: #333;
      --text: #fff; --text-muted: #888; 
      --red: #d90429; --gold: #d4af37; --green: #2ed573; --blue: #1e90ff; --purple: #9b59b6;
      --font: 'Inter', sans-serif; --mono: 'Montserrat', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); overflow-x: hidden; min-height: 100vh; }
    
    /* Навигация */
    .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(5,5,5,0.9); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
    .back-btn { color: var(--gold); text-decoration: none; font-weight: 800; font-size: 1.2rem; transition: 0.2s; }
    .back-btn:hover { color: #fff; }
    .page-title { font-size: 1.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }

    .content { padding: 20px; max-width: 1400px; margin: 0 auto; padding-bottom: 100px; display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
    @media (max-width: 900px) { .content { grid-template-columns: 1fr; } }

    /* =========================================
       ЛЕВАЯ ПАНЕЛЬ (ВВОД ДАННЫХ)
       ========================================= */
    .input-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 25px; }
    
    .section-title { font-size: 1rem; font-weight: 900; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; border-bottom: 1px dashed var(--border); padding-bottom: 10px; }
    
    .input-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .input-group label { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; flex: 1; }
    .input-field { background: var(--elevated); border: 1px solid var(--border); color: var(--text); padding: 12px 15px; border-radius: 8px; width: 140px; text-align: right; font-family: var(--mono); font-weight: 800; font-size: 1rem; }
    .input-field:focus { outline: none; border-color: var(--gold); }
    .input-field.left { width: 100%; text-align: left; }

    /* =========================================
       ПРАВАЯ ПАНЕЛЬ (РЕЗУЛЬТАТЫ)
       ========================================= */
    .result-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 25px; display: flex; flex-direction: column; gap: 20px; }
    
    .kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .kpi-box { background: var(--elevated); border-radius: 12px; padding: 15px; text-align: center; border: 1px solid var(--border); }
    .kpi-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
    .kpi-value { font-size: 1.5rem; font-weight: 900; font-family: var(--mono); }
    .kpi-value.green { color: var(--green); }
    .kpi-value.red { color: var(--red); }

    /* Инсайт (Вердикт) */
    .verdict-box { padding: 20px; border-radius: 12px; border-left: 5px solid; background: rgba(255,255,255,0.02); }
    .verdict-box.good { border-color: var(--green); background: rgba(46, 213, 115, 0.05); }
    .verdict-box.bad { border-color: var(--red); background: rgba(217, 4, 41, 0.05); }
    .verdict-title { font-weight: 900; font-size: 1.1rem; margin-bottom: 5px; text-transform: uppercase; }
    .verdict-text { font-size: 0.9rem; color: var(--text-muted); line-height: 1.4; }

    /* График */
    .chart-container { position: relative; flex: 1; min-height: 250px; width: 100%; margin-top: 10px; }
    
    /* Кнопка */
    .btn { background: var(--gold); color: #000; border: none; padding: 15px; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 1rem; letter-spacing: 1px; transition: 0.3s; width: 100%; margin-top: 10px; }
    .btn:hover { background: #e6c14e; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
    
    /* Список сохраненных идей */
    .saved-ideas { margin-top: 30px; }
    .idea-card { background: var(--elevated); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .idea-name { font-weight: 800; font-size: 1rem; }
    .idea-status { font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; font-weight: 800; }
    .status-good { background: rgba(46,213,115,0.2); color: var(--green); }
    .status-bad { background: rgba(217,4,41,0.2); color: var(--red); }
  </style>
</head>
<body>

<header class="top-nav">
  <a href="index.html" class="back-btn">←</a>
  <div class="page-title">Бизнес-Инкубатор</div>
  <div style="width:24px;"></div>
</header>

<div class="content">

  <!-- ЛЕВАЯ ПАНЕЛЬ: ВВОД -->
  <div class="input-panel">
    <div class="section-title">Параметры бизнеса</div>
    
    <div class="input-group">
      <label>Название идеи:</label>
      <input type="text" id="bizName" class="input-field left" placeholder="Например: Автомойка">
    </div>

    <div class="section-title" style="margin-top:25px;">Стартовый капитал</div>
    <div class="input-group">
      <label>Вложения (оборудование, ремонт):</label>
      <input type="number" id="bizStartup" class="input-field" placeholder="0" oninput="calculateBiz()">
    </div>

    <div class="section-title" style="margin-top:25px;">Ежемесячные расходы (Фикс)</div>
    <div class="input-group">
      <label>Аренда:</label>
      <input type="number" id="bizRent" class="input-field" placeholder="0" oninput="calculateBiz()">
    </div>
    <div class="input-group">
      <label>Зарплаты / Налоги:</label>
      <input type="number" id="bizSalary" class="input-field" placeholder="0" oninput="calculateBiz()">
    </div>
    <div class="input-group">
      <label>Прочее (реклама, связь):</label>
      <input type="number" id="bizOther" class="input-field" placeholder="0" oninput="calculateBiz()">
    </div>

    <div class="section-title" style="margin-top:25px;">Доход и переменные расходы</div>
    <div class="input-group">
      <label>Средний чек (за услугу):</label>
      <input type="number" id="bizPrice" class="input-field" placeholder="0" oninput="calculateBiz()">
    </div>
    <div class="input-group">
      <label>Себестоимость (за услугу):</label>
      <input type="number" id="bizVarCost" class="input-field" placeholder="0" oninput="calculateBiz()">
    </div>
    <div class="input-group">
      <label>Клиентов в месяц (прогноз):</label>
      <input type="number" id="bizVolume" class="input-field" placeholder="0" oninput="calculateBiz()">
    </div>

    <button class="btn" onclick="saveBusinessIdea()">Сохранить расчет</button>

    <!-- Сохраненные идеи -->
    <div class="saved-ideas">
      <div class="section-title">Сохраненные идеи</div>
      <div id="savedIdeasList"></div>
    </div>
  </div>

  <!-- ПРАВАЯ ПАНЕЛЬ: РЕЗУЛЬТАТЫ -->
  <div class="result-panel">
    
    <div class="kpi-row">
      <div class="kpi-box">
        <div class="kpi-label">Точка безубыточности</div>
        <div class="kpi-value" id="resBEP">0 <span style="font-size:0.8rem;color:#888;">услуг</span></div>
      </div>
      <div class="kpi-box">
        <div class="kpi-label">Окупаемость</div>
        <div class="kpi-value" id="resPayback">0 <span style="font-size:0.8rem;color:#888;">мес.</span></div>
      </div>
    </div>

    <div class="kpi-row">
      <div class="kpi-box">
        <div class="kpi-label">Чистая прибыль в мес.</div>
        <div class="kpi-value green" id="resNetProfit">0 тг</div>
      </div>
      <div class="kpi-box">
        <div class="kpi-label">Маржинальность</div>
        <div class="kpi-value" id="resMargin">0%</div>
      </div>
    </div>

    <!-- Вердикт системы -->
    <div class="verdict-box" id="verdictBox">
      <div class="verdict-title" id="verdictTitle">Ожидание данных...</div>
      <div class="verdict-text" id="verdictText">Введи параметры слева, чтобы увидеть анализ.</div>
    </div>

    <!-- График -->
    <div class="chart-container">
      <canvas id="bizChart"></canvas>
    </div>

  </div>

</div>

<script>
  /* ==========================================
     FIREBASE CONFIG
     ========================================== */
  const firebaseConfig = {
    apiKey: "AIzaSyDrPu0bv13jvnju8JJyHkgeRQcf66fDtlk",
    authDomain: "our-tracker-3cbb5.firebaseapp.com",
    databaseURL: "https://our-tracker-3cbb5-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "our-tracker-3cbb5"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const DB_BIZ = db.ref('man_business');

  let bizChartInstance = null;

  /* ==========================================
     ЛОГИКА РАСЧЕТА БИЗНЕСА
     ========================================== */
  function calculateBiz() {
    // 1. Собираем данные из инпутов
    const startup = parseFloat(document.getElementById('bizStartup').value) || 0;
    const rent = parseFloat(document.getElementById('bizRent').value) || 0;
    const salary = parseFloat(document.getElementById('bizSalary').value) || 0;
    const other = parseFloat(document.getElementById('bizOther').value) || 0;
    const price = parseFloat(document.getElementById('bizPrice').value) || 0;
    const varCost = parseFloat(document.getElementById('bizVarCost').value) || 0;
    const volume = parseFloat(document.getElementById('bizVolume').value) || 0;

    // 2. Математика
    const totalFixed = rent + salary + other; // Постоянные расходы
    const marginPerUnit = price - varCost; // Маржа с одной услуги (Переменная прибыль)

    // Защита от деления на ноль
    if (marginPerUnit <= 0) {
      updateUI(0, 0, 0, 0, "bad", "КРИТИЧЕСКАЯ ОШИБКА", "Себестоимость выше или равна цене. Ты будешь работать в убыток с каждой продажи.");
      renderChart([0], [0]);
      return;
    }

    // Точка безубыточности (в штуках)
    const bepUnits = Math.ceil(totalFixed / marginPerUnit);
    
    // Чистая прибыль в месяц (при текущем плане продаж)
    const grossRevenue = price * volume;
    const totalVarCosts = varCost * volume;
    const netProfitMonth = grossRevenue - totalFixed - totalVarCosts;

    // Окупаемость (месяцы)
    let payback = 0;
    if (netProfitMonth > 0) {
      payback = Math.ceil(startup / netProfitMonth);
    } else {
      payback = Infinity;
    }

    // Маржинальность
    const marginPct = ((price - varCost) / price) * 100;

    // 3. Вердикт
    let verdictType = "good";
    let verdictTitle = "БИЗНЕС ЖИЗНЕСПОСОБЕН";
    let verdictText = `Всё сходится. Тебе нужно ${bepUnits} клиентов/услуг в месяц для нулевой прибыли. При твоем плане ты заработаешь ${Math.round(netProfitMonth).toLocaleString()} тг чистыми.`;

    if (volume < bepUnits) {
      verdictType = "bad";
      verdictTitle = "ЗОНА УБЫТКОВ";
      verdictText = `Ты планируешь ${volume} клиентов, а для выхода в ноль нужно ${bepUnits}. Ты будешь терять деньги каждый месяц.`;
    } else if (payback > 36) {
      verdictType = "bad";
      verdictTitle = "ДОЛГАЯ ОКУПАЕМОСТЬ";
      verdictText = `Бизнес окупится только через ${payback} месяцев (3+ года). Это слишком долго и рискованно. Возможно, стоит урезать стартовые расходы.`;
    } else if (payback === Infinity) {
      verdictType = "bad";
      verdictTitle = "МЕРТВЫЙ БИЗНЕС";
      verdictText = "При таком объеме продаж ты никогда не вернешь вложенные деньги. Ищи другую нишу или повышай чек.";
    }

    // 4. Обновляем UI
    updateUI(bepUnits, payback, netProfitMonth, marginPct, verdictType, verdictTitle, verdictText);

    // 5. Рисуем график
    renderChart(volume, netProfitMonth, startup, payback);
  }

  function updateUI(bep, payback, profit, margin, vType, vTitle, vText) {
    document.getElementById('resBEP').innerHTML = `${bep.toLocaleString()} <span style="font-size:0.8rem;color:#888;">услуг</span>`;
    document.getElementById('resPayback').innerHTML = (payback === Infinity || isNaN(payback)) ? '∞' : `${payback.toLocaleString()} <span style="font-size:0.8rem;color:#888;">мес.</span>`;
    document.getElementById('resNetProfit').innerText = `${Math.round(profit).toLocaleString()} тг`;
    document.getElementById('resMargin').innerText = `${Math.round(margin)}%`;

    const box = document.getElementById('verdictBox');
    box.className = `verdict-box ${vType}`;
    document.getElementById('verdictTitle').innerText = vTitle;
    document.getElementById('verdictText').innerText = vText;
  }

  /* ==========================================
     ГРАФИК ОКУПАЕМОСТИ
     ========================================== */
  function renderChart(volume, netProfit, startup, payback) {
    const ctx = document.getElementById('bizChart').getContext('2d');
    if (bizChartInstance) bizChartInstance.destroy();

    // Если данных нет, рисуем пустой график
    if (startup === 0) {
      bizChartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels: ['Старт'], datasets: [{ label: 'Прибыль', data: [0], borderColor: '#888' }] },
        options: { responsive: true, maintainAspectRatio: false }
      });
      return;
    }

    // Строим прогноз на 12 месяцев
    const months = 12;
    const labels = [];
    const dataPoints = [];

    let currentCumulative = -startup; // Начинаем с минуса (вложения)

    for (let i = 1; i <= months; i++) {
      labels.push(`Мес ${i}`);
      currentCumulative += netProfit; // Прибавляем прибыль каждый месяц
      dataPoints.push(currentCumulative);
    }

    // Определяем цвет: если линия уходит в плюс - зеленый
    const isProfitable = dataPoints[dataPoints.length - 1] > 0;

    bizChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Накопленный капитал (тг)',
          data: dataPoints,
          borderColor: isProfitable ? '#2ed573' : '#d90429',
          backgroundColor: isProfitable ? 'rgba(46,213,115,0.1)' : 'rgba(217,4,41,0.1)',
          borderWidth: 3,
          tension: 0.3,
          fill: true,
          pointBackgroundColor: '#fff'
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#fff' } } },
        scales: {
          y: { 
            grid: { color: '#333' }, 
            ticks: { 
              color: '#888',
              callback: function(value) { if(value === 0) return 'Ноль (Окупаемость)'; return value; }
            } 
          },
          x: { grid: { display: false }, ticks: { color: '#888' } }
        }
      }
    });
  }

  /* ==========================================
     СОХРАНЕНИЕ В БАЗУ
     ========================================== */
  function saveBusinessIdea() {
    const name = document.getElementById('bizName').value.trim();
    if(!name) return alert("Введи название бизнеса!");

    const startup = parseFloat(document.getElementById('bizStartup').value) || 0;
    const netProfit = parseFloat(document.getElementById('resNetProfit').innerText.replace(/\D/g,'')) || 0;
    const payback = document.getElementById('resPayback').innerText;

    const newIdea = {
      name: name,
      startup: startup,
      netProfit: netProfit,
      payback: payback,
      date: new Date().toLocaleDateString('ru-RU')
    };

    // Сохраняем в Firebase (с уникальным ключом)
    DB_BIZ.push(newIdea).then(() => {
      alert("Идея сохранена в базу!");
      document.getElementById('bizName').value = '';
    });
  }

  /* ==========================================
     РЕНДЕР СОХРАНЕННЫХ ИДЕЙ
     ========================================== */
  DB_BIZ.on('value', (snap) => {
    const list = document.getElementById('savedIdeasList');
    list.innerHTML = '';
    
    if(!snap.exists()) {
      list.innerHTML = '<p style="color:#666; font-size:0.9rem;">Пока нет сохраненных идей.</p>';
      return;
    }

    const data = snap.val();
    Object.keys(data).reverse().forEach(key => {
      const idea = data[key];
      const isGood = idea.payback !== '∞' && idea.netProfit > 0;
      
      list.innerHTML += `
        <div class="idea-card">
          <div>
            <div class="idea-name">${idea.name}</div>
            <div style="font-size:0.75rem; color:#888;">Вложения: ${idea.startup.toLocaleString()} тг</div>
          </div>
          <div class="idea-status ${isGood ? 'status-good' : 'status-bad'}">
            ${isGood ? `Окуп. за ${idea.payback}` : 'Убыток'}
          </div>
        </div>
      `;
    });
  });

</script>
</body>
</html>
