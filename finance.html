<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>THE CORE | Финансы</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* =========================================
       БАЗА СТИЛЕЙ (Тёмная тема)
       ========================================= */
    :root {
      --bg: #050505; --surface: #121212; --elevated: #1e1e1e; --border: #333;
      --text: #fff; --text-muted: #888; 
      --red: #d90429; --gold: #d4af37; --green: #2ed573; --blue: #1e90ff; --purple: #9b59b6;
      --font: 'Inter', sans-serif; --display: 'Playfair Display', serif; --mono: 'Montserrat', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); overflow-x: hidden; min-height: 100vh; }
    
    /* Навигация */
    .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(5,5,5,0.9); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
    .back-btn { color: var(--gold); text-decoration: none; font-weight: 800; font-size: 1.2rem; transition: 0.2s; }
    .back-btn:hover { color: #fff; }
    .page-title { font-size: 1.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }

    .content { padding: 20px; max-width: 1000px; margin: 0 auto; padding-bottom: 100px; }

    /* =========================================
       ИНФО ПАНЕЛЬ (ВИДЖЕТЫ)
       ========================================= */
    .top-widgets { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
    .widget { background: var(--surface); border: 1px solid var(--border); padding: 15px 20px; border-radius: 12px; }
    .widget-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }
    .widget-val { font-size: 1.5rem; font-weight: 900; font-family: var(--mono); margin-top: 5px; }
    .widget-val.red { color: var(--red); }
    .widget-val.gold { color: var(--gold); }

    /* =========================================
       ТАБЫ
       ========================================= */
    .tabs { display: flex; background: var(--surface); border-radius: 12px; padding: 5px; border: 1px solid var(--border); margin-bottom: 25px; }
    .tab-btn { flex: 1; padding: 15px; background: none; border: none; color: var(--text-muted); font-size: 0.9rem; font-weight: 800; border-radius: 8px; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
    .tab-btn.active { background: var(--elevated); color: var(--text); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

    .pane { display: none; animation: fade 0.3s ease; }
    .pane.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* =========================================
       ФОРМА ВВОДА СМЕНЫ
       ========================================= */
    .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 25px; margin-bottom: 25px; }
    .form-title { font-size: 1.1rem; font-weight: 900; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; border-bottom: 1px dashed var(--border); padding-bottom: 10px; }
    
    .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .input-row label { font-size: 0.95rem; color: var(--text-muted); font-weight: 600; }
    .input-field { background: var(--elevated); border: 1px solid var(--border); color: var(--text); padding: 12px 15px; border-radius: 8px; width: 150px; text-align: right; font-family: var(--mono); font-weight: 800; font-size: 1.1rem; }
    .input-field:focus { outline: none; border-color: var(--gold); }
    .input-field.wide { width: 100%; text-align: left; font-family: var(--font); font-size: 0.95rem;}

    /* Конструктор расходов */
    .expense-section { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin: 20px 0; }
    .expense-title { font-size: 0.9rem; font-weight: 800; color: #ff4757; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;}
    .add-expense-row { display: flex; gap: 10px; margin-bottom: 15px; }
    .add-expense-row input { flex: 1; }
    .btn-add { background: var(--border); color: #fff; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-size: 1.5rem; transition: 0.2s;}
    .btn-add:hover { background: var(--red); }

    .expense-list { display: flex; flex-direction: column; gap: 8px; }
    .exp-item { display: flex; justify-content: space-between; background: var(--elevated); padding: 10px 15px; border-radius: 6px; font-size: 0.9rem; }
    .exp-item span:last-child { color: var(--red); font-weight: 800; font-family: var(--mono); }
    .exp-item .del-exp { background: none; border: none; color: #666; cursor: pointer; margin-left: 10px; }
    .exp-item .del-exp:hover { color: var(--red); }

    /* Итоги */
    .totals-box { background: linear-gradient(135deg, rgba(46,213,115,0.1) 0%, transparent 100%); border: 1px solid rgba(46,213,115,0.3); border-radius: 12px; padding: 20px; margin-top: 20px; }
    .total-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1rem; font-weight: 700; color: #ccc; }
    .total-row:last-child { margin-bottom: 0; font-size: 1.2rem; color: #fff; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 10px; }
    .total-val { font-family: var(--mono); font-weight: 900; }
    .total-val.green { color: var(--green); font-size: 1.5rem; }
    .total-val.red { color: var(--red); }

    .btn-save { width: 100%; background: var(--gold); color: #000; border: none; padding: 18px; border-radius: 10px; font-weight: 900; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.3s; margin-top: 20px; }
    .btn-save:hover { background: #e6c14e; box-shadow: 0 0 20px rgba(212,175,55,0.4); }

    /* =========================================
       ИСТОРИЯ И ГРАФИК
       ========================================= */
    .history-list { display: flex; flex-direction: column; gap: 15px; }
    .history-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .hist-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;}
    .hist-date { font-weight: 900; color: var(--gold); font-size: 1.1rem; }
    .hist-net { font-size: 1.4rem; font-weight: 900; color: var(--green); font-family: var(--mono); }
    
    .hist-details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.85rem; color: var(--text-muted); }
    .hist-details span { color: #fff; font-weight: 700; }

    .chart-container { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 25px; margin-top: 25px; }
    .chart-title { font-size: 1rem; font-weight: 900; text-transform: uppercase; margin-bottom: 20px; color: var(--text-muted);}
    .canvas-wrapper { position: relative; height: 300px; width: 100%; }
  </style>
</head>
<body>

<header class="top-nav">
  <a href="index.html" class="back-btn">←</a>
  <div class="page-title">Финансовый Штаб</div>
  <div style="width:24px;"></div>
</header>

<div class="content">

  <!-- ВИДЖЕТЫ -->
  <div class="top-widgets">
    <div class="widget">
      <div class="widget-label">Общий долг</div>
      <div class="widget-val red" id="widgetDebt">0 тг</div>
    </div>
    <div class="widget">
      <div class="widget-label">Заработано за неделю</div>
      <div class="widget-val gold" id="widgetWeekIncome">0 тг</div>
    </div>
  </div>

  <!-- ТАБЫ -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('entry', this)">Новая смена</button>
    <button class="tab-btn" onclick="switchTab('history', this)">История</button>
  </div>

  <!-- ВКЛАДКА 1: ВВОД СМЕНЫ -->
  <div id="pane-entry" class="pane active">
    <div class="form-card">
      <div class="form-title">Фиксация смены</div>
      
      <div class="input-row">
        <label>Баланс Утром (тг):</label>
        <input type="number" id="morningBal" class="input-field" placeholder="0" oninput="calcShift()">
      </div>
      <div class="input-row">
        <label>Баланс Вечером (тг):</label>
        <input type="number" id="eveningBal" class="input-field" placeholder="0" oninput="calcShift()">
      </div>
      <div class="input-row">
        <label>Часов в смене:</label>
        <input type="number" id="shiftHours" class="input-field" placeholder="12" oninput="calcShift()">
      </div>

      <!-- Блок расходов -->
      <div class="expense-section">
        <div class="expense-title">🔻 Расходы за смену (Аренда, Бензин, Еда)</div>
        <div class="add-expense-row">
          <input type="text" id="expName" class="input-field wide" placeholder="Например: Бензин">
          <input type="number" id="expSum" class="input-field" placeholder="Сумма">
          <button class="btn-add" onclick="addExpense()">+</button>
        </div>
        <div class="expense-list" id="expenseListContainer">
          <!-- Сюда падают расходы -->
        </div>
      </div>

      <!-- Итоги -->
      <div class="totals-box">
        <div class="total-row"><span>Грязный доход:</span> <span class="total-val" id="totalGross">0 тг</span></div>
        <div class="total-row"><span>Расходы:</span> <span class="total-val red" id="totalExpenses">0 тг</span></div>
        <div class="total-row"><span>ЧИСТЫМИ:</span> <span class="total-val green" id="totalNet">0 тг</span></div>
        <div class="total-row"><span>В час:</span> <span class="total-val" id="totalPerHour" style="color: var(--gold);">0 тг</span></div>
      </div>

      <button class="btn-save" onclick="saveShift()">Сохранить смену</button>
    </div>
  </div>

  <!-- ВКЛАДКА 2: ИСТОРИЯ И ГРАФИК -->
  <div id="pane-history" class="pane">
    <div class="chart-container">
      <div class="chart-title">Динамика чистой прибыли (7 смен)</div>
      <div class="canvas-wrapper">
        <canvas id="incomeChart"></canvas>
      </div>
    </div>

    <div class="history-list" id="historyListContainer" style="margin-top:25px;">
      <!-- Карточки смен -->
    </div>
  </div>

</div>

<script>
  /* ==========================================
     FIREBASE CONFIG
     ========================================== */
  const firebaseConfig = {
    apiKey: "AIzaSyDrPu0bv13jvnju8JJyHkgeRQcf66fDtlk",
    authDomain: "our-tracker-3cbb5.firebaseapp.com",
    databaseURL: "https://our-tracker-3cbb5-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "our-tracker-3cbb5"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  
  const DB_FIN = db.ref('man_finance/logs'); // Ветка для смен
  const DB_DEBTS = db.ref('man_debts'); // Ветка для виджета долгов

  // Локальный стейт
  let currentExpenses = []; // Временный массив расходов для текущей смены
  let allShifts = []; // Все смены из базы
  let chartInstance = null;

  /* ==========================================
     СЛУШАЕМ FIREBASE
     ========================================== */
  DB_FIN.on('value', (snap) => {
    if(snap.exists()) {
      const data = snap.val();
      allShifts = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      // Сортируем по timestamp (новые сверху)
      allShifts.sort((a, b) => b.timestamp - a.timestamp);
    } else {
      allShifts = [];
    }
    renderHistory();
    updateWidgets();
  });

  // Слушаем долги, чтобы показать общую сумму наверху
  DB_DEBTS.on('value', (snap) => {
    let total = 0;
    if(snap.exists()) {
      const data = snap.val();
      if(data.bank) data.bank.forEach(b => total += (b.total - b.paid));
      if(data.friends) data.friends.forEach(f => total += (f.total - f.paid));
    }
    document.getElementById('widgetDebt').innerText = total.toLocaleString() + ' тг';
  });

  /* ==========================================
     НАВИГАЦИЯ
     ========================================== */
  function switchTab(tabId, btn) {
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('pane-' + tabId).classList.add('active');
    btn.classList.add('active');
    
    if(tabId === 'history') renderChart();
  }

  /* ==========================================
     ЛОГИКА ДОБАВЛЕНИЯ РАСХОДОВ
     ========================================== */
  function addExpense() {
    const name = document.getElementById('expName').value.trim();
    const sum = parseFloat(document.getElementById('expSum').value);

    if(!name || isNaN(sum) || sum <= 0) {
      return alert("Введи название расхода и сумму!");
    }

    currentExpenses.push({ name, sum });
    
    document.getElementById('expName').value = '';
    document.getElementById('expSum').value = '';
    document.getElementById('expName').focus();

    renderExpenses();
    calcShift();
  }

  function removeExpense(index) {
    currentExpenses.splice(index, 1);
    renderExpenses();
    calcShift();
  }

  function renderExpenses() {
    const container = document.getElementById('expenseListContainer');
    container.innerHTML = '';
    if(currentExpenses.length === 0) {
      container.innerHTML = '<div style="color:#666; font-size:0.85rem;">Нет добавленных расходов</div>';
      return;
    }
    currentExpenses.forEach((exp, i) => {
      container.innerHTML += `
        <div class="exp-item">
          <div>${exp.name}</div>
          <div style="display:flex; align-items:center;">
            <span>- ${exp.sum.toLocaleString()} тг</span>
            <button class="del-exp" onclick="removeExpense(${i})">✖</button>
          </div>
        </div>
      `;
    });
  }

  /* ==========================================
     ЖИВОЙ РАСЧЕТ СМЕНЫ
     ========================================== */
  function calcShift() {
    const morning = parseFloat(document.getElementById('morningBal').value) || 0;
    const evening = parseFloat(document.getElementById('eveningBal').value) || 0;
    const hours = parseFloat(document.getElementById('shiftHours').value) || 12; // По умолчанию 12ч

    const gross = evening - morning;
    const totalExp = currentExpenses.reduce((acc, exp) => acc + exp.sum, 0);
    const net = gross - totalExp;
    const perHour = net > 0 ? Math.round(net / hours) : 0;

    document.getElementById('totalGross').innerText = gross.toLocaleString() + ' тг';
    document.getElementById('totalExpenses').innerText = totalExp.toLocaleString() + ' тг';
    document.getElementById('totalNet').innerText = net.toLocaleString() + ' тг';
    document.getElementById('totalPerHour').innerText = perHour.toLocaleString() + ' тг';
  }

  /* ==========================================
     СОХРАНЕНИЕ СМЕНЫ
     ========================================== */
  function saveShift() {
    const morning = parseFloat(document.getElementById('morningBal').value) || 0;
    const evening = parseFloat(document.getElementById('eveningBal').value) || 0;
    const hours = parseFloat(document.getElementById('shiftHours').value) || 12;

    if(morning === 0 && evening === 0) {
      return alert("Введи хотя бы один баланс (утро или вечер)!");
    }

    const gross = evening - morning;
    const totalExp = currentExpenses.reduce((acc, exp) => acc + exp.sum, 0);
    const net = gross - totalExp;

    const newShift = {
      date: new Date().toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' }),
      timestamp: Date.now(),
      morning: morning,
      evening: evening,
      hours: hours,
      expenses: currentExpenses,
      totalExp: totalExp,
      gross: gross,
      net: net
    };

    DB_FIN.push(newShift).then(() => {
      alert("✅ Смена успешно зафиксирована!");
      
      // Очистка формы
      document.getElementById('morningBal').value = '';
      document.getElementById('eveningBal').value = '';
      document.getElementById('shiftHours').value = '12';
      currentExpenses = [];
      renderExpenses();
      calcShift();
      
      // Переключаем на историю
      const historyBtn = document.querySelectorAll('.tab-btn')[1];
      switchTab('history', historyBtn);
    });
  }

  /* ==========================================
     РЕНДЕР ИСТОРИИ
     ========================================== */
  function renderHistory() {
    const container = document.getElementById('historyListContainer');
    container.innerHTML = '';

    if(allShifts.length === 0) {
      container.innerHTML = '<div style="text-align:center; color:#666; padding:30px;">История пуста. Отработай первую смену.</div>';
      return;
    }

    // Показываем последние 10 смен
    allShifts.slice(0, 10).forEach(shift => {
      
      // Генерируем список расходов
      let expHtml = '';
      if(shift.expenses && shift.expenses.length > 0) {
        shift.expenses.forEach(e => {
          expHtml += `<div style="font-size:0.75rem; color:#888;">- ${e.name}: ${e.sum} тг</div>`;
        });
      } else {
        expHtml = '<div style="font-size:0.75rem; color:#888;">Без расходов</div>';
      }

      container.innerHTML += `
        <div class="history-card">
          <div class="hist-header">
            <div class="hist-date">📅 ${shift.date}</div>
            <div class="hist-net">+${shift.net.toLocaleString()} тг</div>
          </div>
          
          <div class="hist-details">
            <div>Смена: <span>${shift.hours} ч.</span></div>
            <div>В час: <span>${Math.round(shift.net / shift.hours)} тг</span></div>
            <div>Грязный: <span>${shift.gross.toLocaleString()} тг</span></div>
            <div>Расходы: <span style="color:var(--red)">${shift.totalExp.toLocaleString()} тг</span></div>
          </div>

          <div style="margin-top: 15px; border-top: 1px solid #222; padding-top: 10px;">
            ${expHtml}
          </div>
        </div>
      `;
    });
  }

  /* ==========================================
     ГРАФИК
     ========================================== */
  function renderChart() {
    const ctx = document.getElementById('incomeChart').getContext('2d');
    if(chartInstance) chartInstance.destroy();

    // Берем последние 7 смен и переворачиваем (чтобы старые были слева)
    const last7 = allShifts.slice(0, 7).reverse();
    
    const labels = last7.map(s => s.date);
    const data = last7.map(s => s.net);

    if(labels.length === 0) {
      labels.push('Нет данных');
      data.push(0);
    }

    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Чистый доход (тг)',
          data: data,
          backgroundColor: 'rgba(46, 213, 115, 0.8)',
          borderColor: '#2ed573',
          borderWidth: 1,
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { 
            beginAtZero: true, 
            grid: { color: '#333' }, 
            ticks: { color: '#888' } 
          },
          x: { 
            grid: { display: false }, 
            ticks: { color: '#888' } 
          }
        }
      }
    });
  }

  /* ==========================================
     ВИДЖЕТЫ (НЕДЕЛЬНЫЙ ДОХОД)
     ========================================== */
  function updateWidgets() {
    // Считаем доход за последние 7 смен
    const last7 = allShifts.slice(0, 7);
    const weekIncome = last7.reduce((acc, s) => acc + s.net, 0);
    document.getElementById('widgetWeekIncome').innerText = weekIncome.toLocaleString() + ' тг';
  }

</script>
</body>
</html>
