<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>THE CORE | Command Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* CSS БАЗА (Темная тема) */
    :root {
      --bg: #050505; --surface: #121212; --elevated: #1e1e1e; --border: #2a2a2a;
      --text: #f5f5f5; --text-muted: #888; 
      --red: #d90429; --gold: #d4af37; --green: #2ed573; --blue: #1e90ff;
      --font: 'Inter', sans-serif; --display: 'Playfair Display', serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); overflow-x: hidden; }
    
    /* Layout */
    .app { display: flex; flex-direction: column; height: 100vh; max-width: 1400px; margin: 0 auto; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(5,5,5,0.9); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
    .brand { font-family: var(--display); font-size: 1.5rem; font-weight: 700; letter-spacing: 2px; }
    .brand span { color: var(--red); }
    .nav-stats { display: flex; gap: 15px; font-size: 0.85rem; font-weight: 700; }
    .nav-stats span { color: var(--gold); }
    
    .main { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; }
    .tab { display: none; animation: fade 0.4s ease; } .tab.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(18,18,18,0.98); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 15px; z-index: 100; backdrop-filter: blur(15px); }
    .nav-btn { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.65rem; font-weight: 700; cursor: pointer; transition: 0.2s; width: 20%; text-transform: uppercase;}
    .nav-btn svg { width: 22px; height: 22px; fill: currentColor; } .nav-btn.active { color: var(--red); }
    
    /* UI Элементы */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
    .card-title { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; display: flex; gap: 10px; align-items: center;}
    
    .input-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .input-group label { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }
    .input { background: var(--elevated); border: 1px solid var(--border); color: var(--text); padding: 10px 15px; border-radius: 8px; width: 140px; text-align: right; font-family: var(--font); font-weight: 700; }
    .input:focus { outline: none; border-color: var(--red); }
    .input.wide { width: 100%; text-align: left; }
    
    .btn { background: var(--elevated); color: var(--text); border: 1px solid var(--border); padding: 12px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; transition: 0.2s; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; width: 100%; }
    .btn:hover { background: var(--border); }
    .btn-red { background: var(--red); border-color: var(--red); color: #fff; }
    .btn-gold { background: var(--gold); border-color: var(--gold); color: #000; }

    .progress { width: 100%; height: 12px; background: var(--elevated); border-radius: 6px; overflow: hidden; margin: 15px 0 5px; }
    .progress-bar { height: 100%; background: var(--red); width: 0%; transition: 0.5s; }
    .progress-bar.gold { background: var(--gold); }

    .box { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid var(--border); }
    .row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; font-weight: 600; }
    .val { color: var(--gold); font-weight: 800; }
    .val.green { color: var(--green); } .val.red { color: var(--red); }

    /* Дневник */
    .journal-list { display: flex; flex-direction: column; gap: 15px; }
    .j-card { background: var(--elevated); border: 1px solid var(--border); border-radius: 12px; padding: 15px; cursor: pointer; transition: 0.2s; display: flex; gap: 15px; }
    .j-card:hover { border-color: var(--gold); transform: translateX(5px); }
    .j-sticker { font-size: 2rem; }
    .j-content { flex: 1; }
    .j-date { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; margin-bottom: 5px; text-transform: uppercase;}
    .j-summary { font-size: 1rem; color: var(--text); font-weight: 600; }
    .j-text { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--border); color: var(--text-muted); font-size: 0.9rem; white-space: pre-wrap; }
    .j-card.open .j-text { display: block; }
    
    /* Модалка */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 600px; padding: 25px; }
    
    .stickers { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
    .st-btn { font-size: 2rem; background: var(--elevated); border: 2px solid transparent; border-radius: 12px; width: 60px; height: 60px; cursor: pointer; }
    .st-btn.sel { border-color: var(--gold); background: rgba(212,175,55,0.1); transform: scale(1.1); }
    .textarea { width: 100%; height: 150px; background: var(--elevated); border: 1px solid var(--border); color: var(--text); padding: 15px; border-radius: 8px; font-family: var(--font); resize: none; margin-bottom: 20px; }
    
    /* Адаптив */
    @media (min-width: 768px) {
      .bottom-nav { width: 90px; height: 100vh; flex-direction: column; justify-content: flex-start; padding-top: 100px; right: 0; left: auto; border-top: none; border-left: 1px solid var(--border); }
      .nav-btn { width: 100%; margin-bottom: 30px; } .nav-btn span { display: block; margin-top: 5px; }
      .main { padding-right: 120px; }
    }
  </style>
</head>
<body>

<div class="app">
  
  <header class="top-nav">
    <div class="brand">THE <span>CORE</span></div>
    <div class="nav-stats">
      <div>Долг: <span id="navDebt">0</span></div>
      <div>Стрик: <span id="navStreak">0</span></div>
    </div>
  </header>

  <main class="main">
    
    <!-- ВКЛАДКА: ФИНАНСЫ -->
    <section id="tab-fin" class="tab active">
      <div class="grid">
        <div class="card">
          <div class="card-header"><div class="card-title">📉 Ввод за день</div></div>
          <div class="input-group"><label>Баланс утром:</label><input type="number" id="finMorning" class="input" placeholder="0"></div>
          <div class="input-group"><label>Баланс вечером:</label><input type="number" id="finEvening" class="input" placeholder="0"></div>
          <button class="btn btn-primary" onclick="addDailyIncome()">Зафиксировать</button>
          <div class="box" id="finDayResult" style="display:none;">
            <div class="row"><span>Чистыми:</span><span class="val green" id="finNet">0</span></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><div class="card-title">🏦 Кредит</div></div>
          <div class="input-group"><label>Тело кредита:</label><input type="number" id="bankDebt" class="input" onchange="saveBankDebt()"></div>
          <div class="input-group"><label>Платеж:</label><input type="number" id="bankPay" class="input" onchange="saveBankDebt()"></div>
          <div class="progress"><div class="progress-bar gold" id="bankBar"></div></div>
        </div>
      </div>
      
      <div class="card">
        <div class="card-header"><div class="card-title">🤝 Долги друзьям</div></div>
        <div class="input-group">
          <input type="text" id="frName" class="input wide" placeholder="Имя">
          <input type="number" id="frSum" class="input" placeholder="Сумма">
          <button class="btn btn-red" onclick="addFriendDebt()" style="width: 50px; padding: 10px;">+</button>
        </div>
        <div id="friendDebtsList"></div>
      </div>
    </section>

    <!-- ВКЛАДКА: ДНЕВНИК -->
    <section id="tab-diary" class="tab">
      <div class="card">
        <div class="card-header">
          <div class="card-title">📖 Дневник</div>
          <button class="btn btn-gold" onclick="openModal()" style="width: auto;">+ Запись</button>
        </div>
        <div class="journal-list" id="diaryList"></div>
      </div>
    </section>

    <!-- ВКЛАДКА: ДИСЦИПЛИНА -->
    <section id="tab-habit" class="tab">
      <div class="grid">
        <div class="card">
          <div class="card-header"><div class="card-title">⚔️ Стержень</div></div>
          <div class="box" style="text-align:center;">
            <div style="font-size:0.8rem; color:var(--text-muted);">ДНЕЙ ПОДРЯД</div>
            <div style="font-size:3rem; font-weight:900; color:var(--green);" id="streakNum">0</div>
          </div>
          <label style="display:flex; gap:10px; margin-bottom:15px; cursor:pointer;"><input type="checkbox" class="hab" id="h1" onchange="saveHabits()"> Выспался</label>
          <label style="display:flex; gap:10px; margin-bottom:15px; cursor:pointer;"><input type="checkbox" class="hab" id="h2" onchange="saveHabits()"> Отработал смену</label>
          <label style="display:flex; gap:10px; margin-bottom:15px; cursor:pointer;"><input type="checkbox" class="hab" id="h3" onchange="saveHabits()"> Не следил за ней</label>
          <label style="display:flex; gap:10px; margin-bottom:15px; cursor:pointer;"><input type="checkbox" class="hab" id="h4" onchange="saveHabits()"> Спорт/Ремонт</label>
        </div>
      </div>
    </section>

    <!-- ВКЛАДКА: СТРАТЕГИЯ -->
    <section id="tab-strategy" class="tab">
      <div class="card">
        <div class="card-header"><div class="card-title">🏠 Квартира 2031</div></div>
        <div class="input-group"><label>Стоимость:</label><input type="number" id="aptCost" class="input" value="25000000" oninput="calcApt()"></div>
        <div class="input-group"><label>ПВ (%):</label><input type="number" id="aptPct" class="input" value="20" oninput="calcApt()"></div>
        <div class="box">
          <div class="row"><span>Нужно на ПВ:</span><span class="val red" id="aptPV">0</span></div>
          <div class="row"><span>Откладывать в день (5 лет):</span><span class="val green" id="aptDay">0</span></div>
        </div>
      </div>
    </section>
    
  </main>

  <!-- МОДАЛКА ДНЕВНИКА -->
  <div class="modal" id="diaryModal">
    <div class="modal-box">
      <h2 style="color:var(--gold); margin-bottom:10px;">Новая запись</h2>
      <div class="stickers">
        <button class="st-btn" onclick="selSt(this,'🔥')">🔥</button>
        <button class="st-btn" onclick="selSt(this,'💰')">💰</button>
        <button class="st-btn" onclick="selSt(this,'⚔️')">⚔️</button>
        <button class="st-btn" onclick="selSt(this,'🧠')">🧠</button>
        <button class="st-btn" onclick="selSt(this,'💀')">💀</button>
      </div>
      <textarea class="textarea" id="diaryText" placeholder="Что произошло сегодня?"></textarea>
      <div style="display:flex; gap:10px;">
        <button class="btn" onclick="closeModal()">Отмена</button>
        <button class="btn btn-gold" onclick="saveDiary()">Сохранить в облако</button>
      </div>
    </div>
  </div>

  <!-- НАВИГАЦИЯ -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="nav('fin', this)"><svg viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg><span>Финансы</span></button>
    <button class="nav-btn" onclick="nav('diary', this)"><svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7zm1-11h-2v3H8v2h3v3h2v-3h3v-2h-3V8z"/></svg><span>Дневник</span></button>
    <button class="nav-btn" onclick="nav('habit', this)"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg><span>Стержень</span></button>
    <button class="nav-btn" onclick="nav('strategy', this)"><svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg><span>Цели</span></button>
  </nav>

</div>

<script>
  /* ==========================================
     FIREBASE ИНИЦИАЛИЗАЦИЯ
     ========================================== */
  const firebaseConfig = {
    apiKey: "AIzaSyDrPu0bv13jvnju8JJyHkgeRQcf66fDtlk",
    authDomain: "our-tracker-3cbb5.firebaseapp.com",
    databaseURL: "https://our-tracker-3cbb5-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "our-tracker-3cbb5"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Ссылки на ветки в базе (Папки)
  const DB_FIN = db.ref('man_core/finance');
  const DB_DIARY = db.ref('man_core/diary');
  const DB_HABITS = db.ref('man_core/discipline');

  // Глобальные данные
  let data = { finance: { bankDebt: 0, bankPay: 0, debts: [] }, diary: [], habits: {}, streak: { count: 0, lastDate: null } };
  let curSticker = '⚔️';
  let curTab = 'fin';

  /* ==========================================
     СИНХРОНИЗАЦИЯ С БАЗОЙ (СЛУШАЕМ ИЗМЕНЕНИЯ)
     ========================================== */
   
  // 1. Финансы
  DB_FIN.on('value', (snap) => {
    if(snap.exists()) data.finance = snap.val();
    renderFinance();
  });

  // 2. Дневник
  DB_DIARY.on('value', (snap) => {
    if(snap.exists()) data.diary = snap.val();
    renderDiary();
  });

  // 3. Дисциплина
  DB_HABITS.on('value', (snap) => {
    if(snap.exists()) {
      const val = snap.val();
      if(val.habits) data.habits = val.habits;
      if(val.streak) data.streak = val.streak;
    }
    renderHabits();
  });

  /* ==========================================
     ЛОГИКА НАВИГАЦИИ
     ========================================== */
  function nav(tabId, btn) {
    curTab = tabId;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
    btn.classList.add('active');
  }

  /* ==========================================
     ЛОГИКА ФИНАНСОВ
     ========================================== */
  function addDailyIncome() {
    const m = parseFloat(document.getElementById('finMorning').value);
    const e = parseFloat(document.getElementById('finEvening').value);
    if(isNaN(m) || isNaN(e)) return alert("Заполни оба поля!");

    const net = e - m;
    const today = new Date().toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
    
    // Сохраняем в Firebase (добавляем в массив логов)
    if(!data.finance.logs) data.finance.logs = [];
    data.finance.logs.push({ date: today, net: net });
    DB_FIN.update({ logs: data.finance.logs });

    // Обновляем стрик
    if(net > 0) {
      const d = new Date().toDateString();
      if(data.streak.lastDate !== d) {
        data.streak.count++;
        data.streak.lastDate = d;
        DB_HABITS.update({ streak: data.streak });
      }
    }

    document.getElementById('finDayResult').style.display = 'block';
    document.getElementById('finNet').innerText = net.toLocaleString() + ' тг';
    document.getElementById('finMorning').value = '';
    document.getElementById('finEvening').value = '';
    updateNavStats();
  }

  function saveBankDebt() {
    const debt = parseFloat(document.getElementById('bankDebt').value) || 0;
    const pay = parseFloat(document.getElementById('bankPay').value) || 0;
    DB_FIN.update({ bankDebt: debt, bankPay: pay });
  }

  function addFriendDebt() {
    const name = document.getElementById('frName').value;
    const sum = parseFloat(document.getElementById('frSum').value);
    if(!name || isNaN(sum)) return;

    if(!data.finance.debts) data.finance.debts = [];
    data.finance.debts.push({ name, sum, date: new Date().toLocaleDateString('ru-RU') });
    DB_FIN.update({ debts: data.finance.debts });
    
    document.getElementById('frName').value = '';
    document.getElementById('frSum').value = '';
  }

  function deleteFriendDebt(index) {
    if(confirm("Долг закрыт?")) {
      data.finance.debts.splice(index, 1);
      DB_FIN.update({ debts: data.finance.debts });
    }
  }

  function renderFinance() {
    if(document.getElementById('bankDebt')) {
      document.getElementById('bankDebt').value = data.finance.bankDebt || 0;
      document.getElementById('bankPay').value = data.finance.bankPay || 0;
    }
    
    const list = document.getElementById('friendDebtsList');
    if(list) {
      list.innerHTML = '';
      if(data.finance.debts && data.finance.debts.length > 0) {
        data.finance.debts.forEach((d, i) => {
          list.innerHTML += `<div class="box" style="display:flex; justify-content:space-between; align-items:center;">
            <div><b>${d.name}</b><br><small>${d.date}</small></div>
            <div style="display:flex; gap:15px; align-items:center;">
              <span class="val red">${d.sum.toLocaleString()} тг</span>
              <button onclick="deleteFriendDebt(${i})" style="background:none; border:none; color:green; cursor:pointer; font-size:1.2rem;">✔</button>
            </div>
          </div>`;
        });
      }
    }
    updateNavStats();
  }

  /* ==========================================
     ЛОГИКА ДНЕВНИКА (С СИНХРОНИЗАЦИЕЙ)
     ========================================== */
  function openModal() {
    document.getElementById('diaryModal').classList.add('active');
    document.getElementById('diaryText').value = '';
    curSticker = '⚔️';
    document.querySelectorAll('.st-btn').forEach(b => b.classList.remove('sel'));
    document.querySelector('.st-btn:nth-child(3)').classList.add('sel');
  }

  function closeModal() {
    document.getElementById('diaryModal').classList.remove('active');
  }

  function selSt(btn, emoji) {
    document.querySelectorAll('.st-btn').forEach(b => b.classList.remove('sel'));
    btn.classList.add('sel');
    curSticker = emoji;
  }

  function generateAISummary(text) {
    const t = text.toLowerCase();
    if(t.includes('заработал') || t.includes('смена') || t.includes('такс')) return "Финансовый фокус. Смена закрыта.";
    if(t.includes('устал') || t.includes('сон') || t.includes('болит')) return "Нужен отдых. Восстановление сил.";
    if(t.includes('она') || t.includes('любовь')) return "Эмоциональный фон. Работа над собой.";
    return "Рабочий день. Двигаемся дальше.";
  }

  function saveDiary() {
    const text = document.getElementById('diaryText').value.trim();
    if(!text) return alert("Напиши текст!");

    const today = new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute:'2-digit' });
    const newEntry = {
      id: Date.now(),
      date: today,
      sticker: curSticker,
      summary: generateAISummary(text),
      text: text
    };

    if(!data.diary) data.diary = [];
    data.diary.unshift(newEntry);
    
    // Сохраняем в Firebase!
    DB_DIARY.set(data.diary);
    closeModal();
  }

  function renderDiary() {
    const list = document.getElementById('diaryList');
    if(!list) return;
    list.innerHTML = '';

    if(!data.diary || data.diary.length === 0) {
      list.innerHTML = '<p style="text-align:center; color:#666;">Записей пока нет.</p>';
      return;
    }

    data.diary.forEach(entry => {
      const el = document.createElement('div');
      el.className = 'j-card';
      el.onclick = () => el.classList.toggle('open');
      el.innerHTML = `
        <div class="j-sticker">${entry.sticker}</div>
        <div class="j-content">
          <div class="j-date">${entry.date}</div>
          <div class="j-summary">${entry.summary}</div>
          <div class="j-text">${entry.text}</div>
        </div>
      `;
      list.appendChild(el);
    });
  }

  /* ==========================================
     ЛОГИКА ДИСЦИПЛИНЫ
     ========================================== */
  function saveHabits() {
    const checks = document.querySelectorAll('.hab');
    let newHabits = {};
    checks.forEach(c => { newHabits[c.id] = c.checked; });
    
    DB_HABITS.update({ habits: newHabits });
  }

  function renderHabits() {
    const checks = document.querySelectorAll('.hab');
    checks.forEach(c => {
      if(data.habits && data.habits[c.id]) c.checked = true;
      else c.checked = false;
    });

    if(document.getElementById('streakNum')) {
      document.getElementById('streakNum').innerText = data.streak.count || 0;
    }
    updateNavStats();
  }

  /* ==========================================
     СТРАТЕГИЯ И ВСПОМОГАТЕЛЬНОЕ
     ========================================== */
  function calcApt() {
    const cost = parseFloat(document.getElementById('aptCost').value) || 0;
    const pct = parseFloat(document.getElementById('aptPct').value) || 0;
    
    const pv = cost * (pct/100);
    const day = pv / (5 * 365);

    document.getElementById('aptPV').innerText = Math.round(pv).toLocaleString() + ' тг';
    document.getElementById('aptDay').innerText = Math.round(day).toLocaleString() + ' тг';
  }

  function updateNavStats() {
    let fDebt = 0;
    if(data.finance.debts) {
      data.finance.debts.forEach(d => fDebt += d.sum);
    }
    const total = (data.finance.bankDebt || 0) + fDebt;

    if(document.getElementById('navDebt')) document.getElementById('navDebt').innerText = total.toLocaleString();
    if(document.getElementById('navStreak')) document.getElementById('navStreak').innerText = data.streak.count || 0;
  }

  // Init Calc
  window.onload = () => {
    calcApt();
  };

</script>
</body>
</html>
